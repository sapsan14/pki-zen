# Build the VitePress site in a full Ubuntu environment and deploy it
# to Cloudflare Workers via wrangler. This replaces the Cloudflare
# Workers Builds pipeline — that one runs in a minimal image (no rsync,
# no apt packages) and its logs live in the CF dashboard. This workflow
# is stronger and its logs live right in the PR.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" scope, account-limited
#
# The account ID below is public (visible in the dashboard URL).

name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'publish/**'
      - 'scripts/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  # Run the build + smoke-test on every PR so routing regressions (like
  # the 404s that kept slipping through) are caught before merge. The
  # deploy step is gated below on github.event_name == 'push'.
  pull_request:
    paths:
      - 'books/**'
      - 'publish/**'
      - 'scripts/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  # One in-flight run per ref: main deploys serialise on main; each PR
  # has its own group so open PRs don't cancel each other.
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python (for verify + corpus scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify parallel structure
        run: python3 scripts/verify-parallel.py

      - name: Build site (VitePress)
        run: bash publish/build-site-only.sh

      - name: Verify build output exists
        run: |
          ls -la publish/site/.vitepress/dist | head
          test -f publish/site/.vitepress/dist/index.html

      # Route-level smoke test: boot `wrangler dev` against the built
      # site and hit every URL family that's previously broken in prod
      # (language-switcher rewrites, Oracle per-locale pages, legacy
      # /oracle). If any assertion fails, DO NOT deploy — the PR/push
      # is gated on this passing.
      - name: Smoke-test routes with wrangler dev
        run: bash scripts/smoke-test-site.sh

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          # Raw secret — wrapped in another name so we can normalise below
          # without echoing the value.
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0ebf237b8b0470f2beea23f911712f01
        run: |
          # Strip quotes and all whitespace (incl. trailing \r\n that
          # sneaks in from copy-paste) before handing the token to the
          # CF API. Error code 6111 ("Invalid format for Authorization
          # header") is almost always caused by this.
          CLEAN="${RAW_CF_TOKEN//\"/}"
          CLEAN="${CLEAN//\'/}"
          CLEAN="$(printf '%s' "$CLEAN" | tr -d '[:space:]')"
          if [ -z "$CLEAN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Is the secret set on the repo?"
            exit 1
          fi
          # Mask the cleaned value too — belt and suspenders.
          echo "::add-mask::$CLEAN"
          export CLOUDFLARE_API_TOKEN="$CLEAN"
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}  (expected 40-ish)"
          npx --yes wrangler@latest --version
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest deploy
          # Print what actually got deployed (worker name, version,
          # routes). If the route is attached to a DIFFERENT worker in
          # the CF dashboard, production stays on the old code even
          # though this deploy succeeded. The deployments list makes
          # that mismatch visible.
          echo "::group::Deployed worker info"
          npx --yes wrangler@latest deployments list --name pki-zen || true
          echo "::endgroup::"

      # After the deploy call returns "success", hit the real domain and
      # confirm the redirects actually fire. Previously the pipeline
      # claimed success while production still served 404s — that's the
      # exact failure mode this step exists to catch. Give the CF edge a
      # few seconds to propagate, then run the prod smoke test. If it
      # fails the run goes red, so we SEE the mismatch instead of
      # trusting the deploy's exit code.
      - name: Verify production after deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Waiting 15s for edge propagation…"
          sleep 15
          bash scripts/smoke-test-prod.sh https://pki-zen.tyche.institute

      - name: Post-deploy summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "### 🪷 Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Worker: **pki-zen** · https://pki-zen.sokolovmeister.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "Custom domain (once set): https://pki-zen.tyche.institute" >> $GITHUB_STEP_SUMMARY
