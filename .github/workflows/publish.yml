name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
      - 'attic/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'books/**'
      - 'publish/pandoc/**'
      - 'publish/build.sh'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/cache/apt/archives/partial/*.deb
          # Cache key is the hash of the apt install line, so any
          # edit to the package list auto-busts the cache.
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Pandoc and TeX
        run: |
          sudo apt-get update
          # texlive-fonts-extra was pulling 629 MB of fonts we do not
          # use (EB Garamond, Comic Neue, GFS Didot, …). We set fonts
          # explicitly in pdf-template.tex: Noto Serif, Noto Sans,
          # DejaVu Sans Mono — all covered by fonts-noto-core +
          # fonts-dejavu. Drop the extra to save ~5 min download.
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-cyrillic texlive-lang-european \
            fonts-noto-core fonts-dejavu fonts-inter \
            librsvg2-bin rsync
          # Refresh fontconfig so XeLaTeX/fontspec sees newly installed
          # fonts (notably fonts-inter) — dpkg triggers usually handle
          # this, but an explicit rebuild is cheap and avoids a surprise
          # fallback to Noto Sans on fresh runners.
          sudo fc-cache -fv

      - name: Install Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install site deps
        run: cd publish/site && npm ci || npm install

      - name: Build everything
        run: bash publish/build.sh

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: pki-zen-dist
          path: dist/

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pki-zen-ru.epub
            dist/pki-zen-en.epub
            dist/pki-zen-et.epub
            dist/pki-zen-ru.pdf
            dist/pki-zen-en.pdf
            dist/pki-zen-et.pdf
            dist/SHA256SUMS
