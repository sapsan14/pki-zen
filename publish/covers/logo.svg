<?xml version="1.0" encoding="UTF-8"?>
<!--
  PKI-ZEN mark (v4 — evenly packed hex):
  - 16-petal lotus mandala (8 major + 8 interleaved minor)
  - SIX concentric hexadecimal rings (r = 38, 49, 60, 71, 82, 93),
    identical font-size and line-height so no two rings collide
    vertically; no circle outlines beneath them
  - alternating sweep direction for a "rotating data" feel
  - tight inner disc with ∞ — the probability signature of the book

  Palette matches publish/covers/cover.svg and the VitePress theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"
     width="256" height="256" role="img" aria-label="PKI-ZEN lotus mark">
  <defs>
    <!-- Six hex paths, evenly spaced. Alternating sweep (0/1) flips
         text direction on adjacent rings for visual rotation. -->
    <path id="ring-93" d="M 128,128 m -93,0 a 93,93 0 1,1 186,0 a 93,93 0 1,1 -186,0" fill="none"/>
    <path id="ring-82" d="M 128,128 m -82,0 a 82,82 0 1,0 164,0 a 82,82 0 1,0 -164,0" fill="none"/>
    <path id="ring-71" d="M 128,128 m -71,0 a 71,71 0 1,1 142,0 a 71,71 0 1,1 -142,0" fill="none"/>
    <path id="ring-60" d="M 128,128 m -60,0 a 60,60 0 1,0 120,0 a 60,60 0 1,0 -120,0" fill="none"/>
    <path id="ring-49" d="M 128,128 m -49,0 a 49,49 0 1,1  98,0 a 49,49 0 1,1  -98,0" fill="none"/>
    <path id="ring-38" d="M 128,128 m -38,0 a 38,38 0 1,0  76,0 a 38,38 0 1,0  -76,0" fill="none"/>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"   stop-color="#4a3b2a" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <!-- soft halo -->
  <circle cx="128" cy="128" r="126" fill="url(#glow)"/>

  <!-- 16-petal lotus -->
  <g transform="translate(128,128)" stroke="#4a3b2a" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="3" opacity="0.92">
      <ellipse rx="18" ry="108" transform="rotate(0)"/>
      <ellipse rx="18" ry="108" transform="rotate(45)"/>
      <ellipse rx="18" ry="108" transform="rotate(90)"/>
      <ellipse rx="18" ry="108" transform="rotate(135)"/>
    </g>
    <g stroke-width="2.2" opacity="0.55">
      <ellipse rx="10" ry="96" transform="rotate(22.5)"/>
      <ellipse rx="10" ry="96" transform="rotate(67.5)"/>
      <ellipse rx="10" ry="96" transform="rotate(112.5)"/>
      <ellipse rx="10" ry="96" transform="rotate(157.5)"/>
    </g>
  </g>

  <!-- Six hex rings — identical font-size (7.5) / letter-spacing so
       baselines never collide. Opacity tapers slightly inward so the
       ∞ stays the focal point. -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace"
     font-size="7.5" fill="#6a5a3a" letter-spacing="1.6">
    <text opacity="0.88">
      <textPath href="#ring-93" startOffset="0">
        7f 3a d1 02 e4 c9 8b 5c 12 af 44 90 ee 6b 71 03 22 5d 9e 8f a0 14 67 bc 01 9d f3 2b 8e 71 4c ad 55 cc 7a 0b
      </textPath>
    </text>
    <text opacity="0.82">
      <textPath href="#ring-82" startOffset="0">
        c8 17 6f d5 91 4a 2e b0 38 e9 7d 11 06 bb 54 27 f2 83 0c 9a 65 d4 1b ae 70 3f e1 8c 25 49 ba 06
      </textPath>
    </text>
    <text opacity="0.78">
      <textPath href="#ring-71" startOffset="0">
        ff 00 aa 55 3c c3 5a a5 69 96 1e e1 b7 48 24 db 0d f2 7c 83 4e b1 92 6d 18 e7 6a 95
      </textPath>
    </text>
    <text opacity="0.72">
      <textPath href="#ring-60" startOffset="0">
        41 7d 8e b3 00 12 f5 9c 6b 2a d0 84 39 ee 5f c1 77 ab 26 dd 50 93 48 ef 19 a7
      </textPath>
    </text>
    <text opacity="0.66">
      <textPath href="#ring-49" startOffset="0">
        1a 2b 3c 4d 5e 6f 70 81 92 a3 b4 c5 d6 e7 f8 09 0a 1b 2c 3d 4e 5f
      </textPath>
    </text>
    <!-- innermost ring — the hacker-hex easter egg -->
    <text opacity="0.58">
      <textPath href="#ring-38" startOffset="0">
        de ad be ef ba be fa ce 13 37 c0 de ca fe 00 01
      </textPath>
    </text>
  </g>

  <!-- inner disc; r=28 just fits the infinity glyph -->
  <circle cx="128" cy="128" r="28" fill="#faf8f1" stroke="#4a3b2a" stroke-width="1.3"/>

  <!-- infinity — probability signature -->
  <g transform="translate(128,131)" stroke="#4a3b2a" stroke-width="4.8" fill="none"
     stroke-linecap="round">
    <path d="M -17,0
             C -17,-12 -8,-12  0,0
             C 8,12  17,12  17,0
             C 17,-12 8,-12  0,0
             C -8,12 -17,12  -17,0 Z"/>
  </g>
</svg>
