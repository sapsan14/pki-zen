<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f1"/>
      <stop offset="1" stop-color="#e8e3d1"/>
    </linearGradient>
    <pattern id="hex" x="0" y="0" width="90" height="22" patternUnits="userSpaceOnUse">
      <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="14" fill="#b4aa88" opacity="0.35">7f 3a d1 02 e4 c9</text>
    </pattern>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="600" height="900" fill="url(#hex)" opacity="0.7"/>

  <!-- Lotus (stylised, 8 petals) -->
  <g transform="translate(300,480)" stroke="#4a3b2a" stroke-width="2" fill="none" opacity="0.75">
    <ellipse rx="40" ry="110" transform="rotate(0)"/>
    <ellipse rx="40" ry="110" transform="rotate(45)"/>
    <ellipse rx="40" ry="110" transform="rotate(90)"/>
    <ellipse rx="40" ry="110" transform="rotate(135)"/>
    <ellipse rx="40" ry="110" transform="rotate(22.5)"/>
    <ellipse rx="40" ry="110" transform="rotate(67.5)"/>
    <ellipse rx="40" ry="110" transform="rotate(112.5)"/>
    <ellipse rx="40" ry="110" transform="rotate(157.5)"/>
    <circle r="28" fill="#4a3b2a" stroke="none"/>
  </g>

  <!-- Title -->
  <text x="300" y="180" text-anchor="middle" font-family="EB Garamond, Georgia, serif"
        font-size="72" font-weight="600" fill="#1a1a1a" letter-spacing="4">PKI-ZEN</text>
  <text x="300" y="230" text-anchor="middle" font-family="EB Garamond, Georgia, serif"
        font-size="22" font-style="italic" fill="#3a2a18">
    A Sūtra of Certificates, YAML, and Almost-Enlightenment
  </text>

  <!-- Russian line -->
  <text x="300" y="710" text-anchor="middle" font-family="EB Garamond, Georgia, serif"
        font-size="20" font-style="italic" fill="#3a2a18">
    Сутра о сертификатах, YAML и почти-просветлении
  </text>
  <text x="300" y="738" text-anchor="middle" font-family="EB Garamond, Georgia, serif"
        font-size="20" font-style="italic" fill="#3a2a18">
    Sertifikaatide, YAML-i ja peaaegu-valgustumise suutra
  </text>

  <text x="300" y="820" text-anchor="middle" font-family="JetBrains Mono, monospace"
        font-size="14" fill="#6a5a3a">$ openssl rand -hex 32</text>
  <text x="300" y="850" text-anchor="middle" font-family="EB Garamond, Georgia, serif"
        font-size="14" fill="#6a5a3a">Anton Sokolov &#x00B7; 2026</text>
</svg>
