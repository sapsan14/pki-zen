<?xml version="1.0" encoding="UTF-8"?>
<!--
  PKI-ZEN mark (v2 — more bytes):
  - 16-petal lotus mandala (8 outer + 8 interleaved)
  - two concentric hexadecimal rings (cryptography motif)
  - micro hex "whispers" along the spine of each major petal
  - infinity at the center — the probability signature of the book

  Palette matches publish/covers/cover.svg and the VitePress theme.
  Render-size agnostic; works at 16×16 (favicon) and 512×512 (hero).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"
     width="256" height="256" role="img" aria-label="PKI-ZEN lotus mark">
  <defs>
    <!-- outer hex ring (r = 82) -->
    <path id="hex-ring-outer" d="M 128,128 m -82,0 a 82,82 0 1,1 164,0 a 82,82 0 1,1 -164,0" fill="none"/>
    <!-- inner hex ring (r = 50) -->
    <path id="hex-ring-inner" d="M 128,128 m -50,0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0" fill="none"/>
    <!-- a straight line for petal hex whisper; rendered once, rotated per petal -->
    <path id="petal-spine" d="M 128,28 L 128,108" fill="none"/>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"   stop-color="#4a3b2a" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <!-- soft halo -->
  <circle cx="128" cy="128" r="126" fill="url(#glow)"/>

  <!-- 16-petal lotus -->
  <g transform="translate(128,128)" stroke="#4a3b2a" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="3" opacity="0.92">
      <ellipse rx="18" ry="108" transform="rotate(0)"/>
      <ellipse rx="18" ry="108" transform="rotate(45)"/>
      <ellipse rx="18" ry="108" transform="rotate(90)"/>
      <ellipse rx="18" ry="108" transform="rotate(135)"/>
    </g>
    <g stroke-width="2.2" opacity="0.55">
      <ellipse rx="10" ry="96" transform="rotate(22.5)"/>
      <ellipse rx="10" ry="96" transform="rotate(67.5)"/>
      <ellipse rx="10" ry="96" transform="rotate(112.5)"/>
      <ellipse rx="10" ry="96" transform="rotate(157.5)"/>
    </g>
  </g>

  <!-- hex whispers along each major petal spine (4 axes × 2 sides ≈ 8) -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace"
     font-size="7" fill="#6a5a3a" opacity="0.55" letter-spacing="1.2">
    <!-- rotate groups of micro-text around centre -->
    <g transform="rotate(0 128 128)">
      <text x="124" y="48">a1</text><text x="124" y="64">3f</text>
      <text x="124" y="80">9c</text><text x="124" y="96">d0</text>
    </g>
    <g transform="rotate(45 128 128)">
      <text x="124" y="48">7e</text><text x="124" y="64">b2</text>
      <text x="124" y="80">04</text><text x="124" y="96">cf</text>
    </g>
    <g transform="rotate(90 128 128)">
      <text x="124" y="48">55</text><text x="124" y="64">8d</text>
      <text x="124" y="80">2a</text><text x="124" y="96">e7</text>
    </g>
    <g transform="rotate(135 128 128)">
      <text x="124" y="48">6b</text><text x="124" y="64">c1</text>
      <text x="124" y="80">f0</text><text x="124" y="96">19</text>
    </g>
  </g>

  <!-- outer hex ring (r=82) -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#b4aa88" stroke-width="1" opacity="0.75"/>
  <text font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace"
        font-size="9" fill="#6a5a3a" letter-spacing="1.8" opacity="0.85">
    <textPath href="#hex-ring-outer" startOffset="0">
      7f 3a d1 02 e4 c9 8b 5c 12 af 44 90 ee 6b 71 03 22 5d 9e 8f a0 14 67 bc 01 9d f3 2b 8e 71 4c ad
    </textPath>
  </text>

  <!-- inner hex ring (r=50) -->
  <circle cx="128" cy="128" r="50" fill="none" stroke="#b4aa88" stroke-width="0.8" opacity="0.65"/>
  <text font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace"
        font-size="7.2" fill="#6a5a3a" letter-spacing="1.1" opacity="0.75">
    <textPath href="#hex-ring-inner" startOffset="0">
      fe dc ba 98 76 54 32 10  0f 1e 2d 3c 4b 5a 69 78  87 96 a5 b4 c3 d2 e1 f0
    </textPath>
  </text>

  <!-- inner disc (to keep ∞ readable against the ring) -->
  <circle cx="128" cy="128" r="34" fill="#faf8f1" stroke="#4a3b2a" stroke-width="1.4"/>

  <!-- infinity — probability signature -->
  <g transform="translate(128,132)" stroke="#4a3b2a" stroke-width="5.5" fill="none"
     stroke-linecap="round">
    <path d="M -20,0
             C -20,-14 -9,-14  0,0
             C 9,14  20,14  20,0
             C 20,-14 9,-14  0,0
             C -9,14 -20,14  -20,0 Z"/>
  </g>
</svg>
