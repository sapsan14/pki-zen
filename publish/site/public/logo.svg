<?xml version="1.0" encoding="UTF-8"?>
<!--
  PKI-ZEN mark:
  - 8-petal lotus outline (zen)
  - hexadecimal ring (cryptography)
  - infinity in the center (probability ∞ motif of the book)

  Palette matches publish/covers/cover.svg and the VitePress theme.
  Render-size agnostic; works at 16×16 (favicon) and 512×512 (hero).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"
     width="256" height="256" role="img" aria-label="PKI-ZEN lotus mark">
  <defs>
    <path id="hex-ring" d="M 128,128 m -78,0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none"/>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"   stop-color="#4a3b2a" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <!-- soft halo (optional; invisible on light bg) -->
  <circle cx="128" cy="128" r="126" fill="url(#glow)"/>

  <!-- 8 lotus petals -->
  <g transform="translate(128,128)" stroke="#4a3b2a" stroke-width="3" fill="none"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <ellipse rx="18" ry="108" transform="rotate(0)"/>
    <ellipse rx="18" ry="108" transform="rotate(45)"/>
    <ellipse rx="18" ry="108" transform="rotate(90)"/>
    <ellipse rx="18" ry="108" transform="rotate(135)"/>
    <!-- interleaved smaller petals, to suggest an 16-petal mandala at close view -->
    <ellipse rx="10" ry="96" transform="rotate(22.5)"  opacity="0.55"/>
    <ellipse rx="10" ry="96" transform="rotate(67.5)"  opacity="0.55"/>
    <ellipse rx="10" ry="96" transform="rotate(112.5)" opacity="0.55"/>
    <ellipse rx="10" ry="96" transform="rotate(157.5)" opacity="0.55"/>
  </g>

  <!-- hex ring (cryptographic motif) -->
  <circle cx="128" cy="128" r="62" fill="none" stroke="#b4aa88" stroke-width="1.2" opacity="0.85"/>
  <text font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', monospace"
        font-size="10" fill="#6a5a3a" letter-spacing="2" opacity="0.8">
    <textPath href="#hex-ring" startOffset="0">
      7f 3a d1 02  e4 c9 8b 5c  12 af 44 90  ee 6b 71 03  &#x00B7;  &#x00B7;  &#x00B7;
    </textPath>
  </text>

  <!-- inner disc -->
  <circle cx="128" cy="128" r="44" fill="#faf8f1" stroke="#4a3b2a" stroke-width="1.5"/>

  <!-- infinity — the probability signature of the book -->
  <g transform="translate(128,132)" stroke="#4a3b2a" stroke-width="6" fill="none"
     stroke-linecap="round">
    <path d="M -22,0
             C -22,-16 -10,-16  0,0
             C 10,16  22,16  22,0
             C 22,-16 10,-16  0,0
             C -10,16 -22,16  -22,0 Z"/>
  </g>
</svg>
